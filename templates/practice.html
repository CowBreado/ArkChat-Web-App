<section class="top-navbar-section">

<main>
    <section class="modal-section">

            <button onclick="showModal()">Show Modal</button>

            <div class="modal-overlay">
                <div class="modal-content">
                    <span id="closeModalbtn" class="close">&times;</span>
                    <p>This is a simple modal popup</p>
                    <button onclick="hideModal()" class="close-button">Hide Modal</button>
                </div>
            </div>



    </section>
</main>
    <script>
        <!-- Link to your JavaScript file -->
        modal = document.querySelector('.modal-overlay')
        modal_content = document.querySelector('.modal-content')

        //Making an eventlistener to detect 
        modal.addEventListener('click', hideModal)
        modal_content.addEventListener('click',(e) =>{
            e.stopPropagation();
        })
        function showModal(){
            document.querySelector('.modal-overlay').style.display = "flex"
        }
        function hideModal(){
            document.querySelector('.modal-overlay').style.display = 'none'
        }
    </script>







</body>
