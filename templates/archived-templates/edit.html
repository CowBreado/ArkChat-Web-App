<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Create User</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Creating a simple submit format. -->
    <div class="form-card">
        <div>
            <a href="/">Home</a>           
            <!-- name is for server identification, id is for js manipulation -->
            <h2 class="center-text" style="padding:10px;">Edit User</h2>
            <form action="/edit/search" method="POST">
                <label for="username">Find Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter username"><br>
                <input type="Submit" value="Edit User"> 
            </form>
        </div>
    </div>
    <!-- Link to your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
