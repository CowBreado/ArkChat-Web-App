<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Create User</title>
    <link rel="icon" type="image/x-icon" href="../static/asset/nianBean.jpg">
</head>
<body>
    <!--Creating a simple submit format. -->
    <div class="form-card">
        <div>
            <a href="/">Home</a>
            <!-- name is for server identification, id is for js manipulation -->
            <h2 class="center-text">Create User</h2>
            <form action="/create" method="POST">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter Username"><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter password"><br>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter age (in years)"><br>

                <input style="margin:0px;"type="Submit" value="Submit">
            </form>
        </div>
    </div>
    <!-- Link to your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
